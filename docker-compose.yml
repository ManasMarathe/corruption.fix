# Dev-parity Postgres + PostGIS for machines without a local Postgres install.
# Not used on machines where Postgres 16 + PostGIS is installed natively (e.g. via Homebrew).
#
# Usage:
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/corruptionfix

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: corruptionfix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corruptionfix
    ports:
      - "5432:5432"
    volumes:
      - corruptionfix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corruptionfix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corruptionfix-pgdata:
