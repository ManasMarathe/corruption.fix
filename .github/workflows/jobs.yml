name: Scheduled Jobs

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if APP_URL is not configured
        id: check
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "APP_URL repository variable is not set — skipping scheduled jobs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh stats
        if: steps.check.outputs.skip == 'false'
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" \
            "${{ vars.APP_URL }}/api/jobs/refresh-stats"

      - name: Sign checkpoint
        if: steps.check.outputs.skip == 'false'
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" \
            "${{ vars.APP_URL }}/api/jobs/sign-checkpoint"

      - name: Evaluate thresholds
        if: steps.check.outputs.skip == 'false'
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" \
            "${{ vars.APP_URL }}/api/jobs/evaluate-thresholds"
