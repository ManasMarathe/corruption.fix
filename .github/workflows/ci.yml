# Tests, then migrations, then deploy — in that order, on every push to main.
#
# Vercel's own Git auto-deploy for `main` is switched off in web/vercel.json.
# That is deliberate: Vercel starts building the moment you push, which would
# race the migration job here and could put schema-dependent code live before
# the columns it reads exist. Turning it off makes this workflow the single
# path to production, so "migrate, then deploy" is guaranteed rather than
# merely likely. Preview deployments for branches and PRs are untouched.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24, matching the runtime the project is configured for on
      # Vercel. Not a free choice: ai@7 and every @ai-sdk/* package declare
      # engines.node >=22, and package-lock.json was authored by npm 11 —
      # the npm 10 that ships with Node 20 fails to resolve tsx nested copy
      # of esbuild out of it and aborts npm ci with EUSAGE.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  migrate:
    # Only real pushes to main touch production; PRs stop at build-and-test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    # Shared with `deploy` so two rapid pushes can never interleave a
    # migration with someone else's deploy. Never cancel in progress: a
    # half-applied migration is worse than a slow queue.
    concurrency:
      group: production-pipeline
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Secrets can't be read in a job-level `if:`, so the guard is a step —
      # same shape as the APP_URL check in jobs.yml.
      - name: Check for PROD_DATABASE_URL
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set — migrations were NOT applied and nothing will deploy."
            exit 1
          fi

      # scripts/migrate.mjs rather than `npm run db:migrate`: drizzle-kit
      # exits 1 with no message when a connection or statement fails, which
      # is exactly what happened on the first attempt here. The script runs
      # the same migrations through drizzle-orm and prints the real error,
      # plus a named check for the most likely misconfiguration — the
      # transaction pooler (6543) instead of the session pooler (5432).
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/migrate.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    concurrency:
      group: production-pipeline
      cancel-in-progress: false
    # No working-directory here, unlike the jobs above: Vercel applies the
    # project's own Root Directory setting ("web") to whatever it is given, so
    # the CLI has to run from the repo root or it would look for web/web.
    # Hardcoded rather than read from repo variables: these are identifiers,
    # not credentials. On their own they grant nothing — every Vercel API
    # call still needs VERCEL_TOKEN — so keeping them here means the only
    # things that have to be configured by hand are the two real secrets.
    env:
      VERCEL_ORG_ID: team_RpYGYegyhsnvamfo5lLSjmWv
      VERCEL_PROJECT_ID: prj_6QFpAyFJsSntCMq6hPaYBIXL9Xzq
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed to run the Vercel CLI — the app itself is built on
      # Vercel (see the deploy step), not here.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set — migrations ran but nothing deployed. Vercel git auto-deploy is off (web/vercel.json), so production is unchanged."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Source upload, deliberately NOT `vercel build --prebuilt`.
      # DATABASE_URL and SESSION_SECRET are stored as *sensitive* env vars,
      # which `vercel pull` returns as the literal "[SENSITIVE]" — and
      # src/lib/env.ts validates both at import time, so a build here would
      # fail on a bad DATABASE_URL. Building on Vercel lets the platform
      # inject the real values. The repo-root .vercelignore is what keeps
      # pipeline/ out of the upload.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
